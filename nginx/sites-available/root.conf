server {
    listen 80 default_server;

    # Authentik Forward Auth endpoint
    location = /outpost.goauthentik.io/auth/nginx {
        internal;
        proxy_pass http://10.0.10.205:9000/outpost.goauthentik.io/auth/nginx;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
    }

    # Redirect root to /media
    location = / {
        return 301 /auth/;
    }

    # Autoindex only under /media/
    location /media/ {
        alias /mnt/media/;       # trailing slash is important
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        try_files $uri $uri/ =404;

        # Allow LAN and VPN traffic
        allow 10.0.10.0/24;  # LAN
        allow 10.0.99.0/24;  # VPN
        deny all;

        # Optional basic auth
        # auth_basic "Media";
        # auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # Authentik - Authentication & Authorization (No auth required - this IS the auth)
    location /auth/ {
        proxy_pass http://10.0.10.205:9000/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;

        # Allow LAN and VPN traffic
        allow 10.0.10.0/24;  # LAN
        allow 10.0.99.0/24;  # VPN
        deny all;
    }

    # Plex Media Server - PROTECTED
    location /plex/ {
        # Require authentication through Authentik
        auth_request /outpost.goauthentik.io/auth/nginx;
        error_page 401 = @goauthentik_proxy_signin;
        
        proxy_pass http://10.0.10.203:32400/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Allow LAN and VPN traffic
        allow 10.0.10.0/24;  # LAN
        allow 10.0.99.0/24;  # VPN
        deny all;
    }

    # Sonarr
    location /sonarr/ {
        # Require authentication through Authentik
        auth_request /outpost.goauthentik.io/auth/nginx;
        error_page 401 = @goauthentik_proxy_signin;
        
        proxy_pass http://10.0.10.203:8989/sonarr/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_redirect off;
        
        # Allow LAN and VPN traffic
        allow 10.0.10.0/24;  # LAN
        allow 10.0.99.0/24;  # VPN
        deny all;
    }

    # Radarr
