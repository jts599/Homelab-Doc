    }

    # Redirect to Authentik login
    location @goauthentik_proxy_signin {
        internal;
        return 302 /auth/if/flow/default-authentication-flow/?next=$scheme://$http_host$request_uri;
    }

    # Block everything else
    location / {
        return 403;
    }
}