version: "3.8"

networks:
  media-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

services:

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
      - ADVERTISE_IP=${PLEX_ADVERTISE_IP}
    volumes:
      - ${PLEX_CONFIG}:/config
      - ${MEDIA_ROOT}:/data/media
    devices:
      - /dev/dri:/dev/dri
    tmpfs:
      - /transcode:size=8G

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${NORD_WG_PRIVATE_KEY}
      - SERVER_HOSTNAMES=es257.nordvpn.com
      - FIREWALL=on
      - FIREWALL_VPN_INPUT_PORTS=${QBIT_WEBUI_PORT},${SABNZBD_WEBUI_PORT},${FLARESOLVERR_PORT:-8191},6881,1337,6969
      - FIREWALL_INPUT_PORTS=${QBIT_WEBUI_PORT},${SABNZBD_WEBUI_PORT},${FLARESOLVERR_PORT:-8191}
      - DNS_UPSTREAM_RESOLVER_TYPE=plain
    volumes:
      - ${GLUETUN_CONFIG}:/gluetun
    ports:
      - ${QBIT_WEBUI_PORT}:${QBIT_WEBUI_PORT}
      - ${SABNZBD_WEBUI_PORT}:${SABNZBD_WEBUI_PORT}
      - ${FLARESOLVERR_PORT:-8191}:${FLARESOLVERR_PORT:-8191}
      - 6881:6881
      - 6881:6881/udp
    networks:
      - media-network

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
      - WEBUI_PORT=${QBIT_WEBUI_PORT}
    volumes:
      - ${QBIT_CONFIG}:/config
      - ${QBIT_DOWNLOADS}:/downloads

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
    volumes:
      - ${SONARR_CONFIG}:/config
      - ${TV_SHOWS_ROOT}:/tv 
      - ${DOWNLOADS_ROOT}:/downloads 
    ports:
      - 8989:8989
    restart: unless-stopped
    networks:
      - media-network

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
    volumes:
      - ${RADARR_CONFIG}:/config
      - ${MOVIES_ROOT}:/movies 
      - ${DOWNLOADS_ROOT}:/downloads 
    ports:
      - 7878:7878
    restart: unless-stopped
    networks:
      - media-network

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_INTERVAL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
    volumes:
      - ${PROWLARR_CONFIG}:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    networks:
      - media-network

  overseerr:
    image: lscr.io/linuxserver/overseerr:latest
    container_name: overseerr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
    volumes:
      - ${OVERSEERR_CONFIG}:/config
    ports:
      - 5055:5055
    restart: unless-stopped
    networks:
      - media-network

  bookshelf:
    image: ghcr.io/pennydreadful/bookshelf:hardcover
    container_name: bookshelf
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
    volumes:
      - ${BOOKSHELF_CONFIG}:/config
      - ${BOOKS_ROOT}:/books
    ports:
      - 8083:8083
    restart: unless-stopped
    networks:
      - media-network

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=${UMASK}
      - TZ=${TZ}
    volumes:
      - ${BAZARR_CONFIG}:/config
      - ${MOVIES_ROOT}:/movies
      - ${TV_SHOWS_ROOT}:/tv
    ports:
      - 6767:6767
    restart: unless-stopped
    networks:
      - media-network

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      - gluetun
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=${TZ}

  browser:
    image: lscr.io/linuxserver/chromium:latest
    container_name: browser
    security_opt:
      - seccomp:unconfined #optional
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - CHROME_CLI=--no-sandbox --disable-gpu --disable-web-security --ignore-ssl-errors --ignore-certificate-errors --disable-features=VizDisplayCompositor --allow-running-insecure-content --disable-extensions
    volumes:
      - ${BROWSER_CONFIG:-./browser-config}:/config
    ports:
      - 3000:3000
      - 3001:3001
    restart: unless-stopped
    networks:
      - media-network